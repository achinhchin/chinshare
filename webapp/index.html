<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>ChinShare - Advanced Screen Sharing</title>
    <link rel="stylesheet" href="style.css">
</head>

<body><button id="theme-toggle" onclick="toggleTheme()">🌙</button>
    <div id="app">
        <!-- View 1: Home -->
        <div id="home-view" class="panel">
            <h1>ChinShare</h1>
            <p style="color: var(--text-secondary)">Simple & Fast Screen Sharing</p>
            <div style="margin-top: 30px;"><button class="btn" id="btn-create" onclick="createRoom()"
                    disabled>Connecting...</button><br>
                <div style="margin: 20px; position: relative"><span
                        style="background: var(--surface); padding: 0 10px; color: var(--text-secondary); font-size: 0.9rem">OR</span>
                </div><input type="text" id="room-input" placeholder="Room Code" maxlength="6"><br><button
                    class="btn btn-outline" id="btn-join" onclick="joinRoom()" disabled>Connecting...</button>
                <div style="margin-top: 12px; font-size: 0.9rem;">
                    <a href="#" onclick="createRoom(); return false;"
                        style="color: var(--text-secondary); text-decoration: none;">Join as
                        Broadcaster</a>
                </div>
            </div>
        </div>
        <!-- View 2: Setup (Broadcaster) -->
        <div id="setup-view" class="panel hidden">
            <h2>Your Room Code</h2>
            <div id="display-code" class="room-code">......</div>
            <p>Share this code with viewers</p>
            <div class="control-group" style="text-align: left; margin-top: 20px;">
                <label>Resolution Limit</label><select id="res-limit">
                    <option value="1080">1080p</option>
                    <option value="720">720p</option>
                    <option value="unlimited">Unlimited</option>
                </select>
                <div id="content-hint-container" class="hidden">
                    <label>Content Hint</label>
                    <select id="content-hint-select" onchange="applyContentHint(this.value)">
                        <option value="motion">Motion (Smooth Video)</option>
                        <option value="detail">Detail (Clear Text)</option>
                        <option value="text">Text (Sharpest)</option>
                    </select>
                </div>
            </div>

            <!-- Source Selection -->
            <div class="source-selector">
                <button class="source-btn active" id="btn-source-screen" onclick="setSource('screen')">💻
                    Screen</button>
                <button class="source-btn" id="btn-source-file" onclick="setSource('file')">📁 File</button>
                <button class="source-btn" id="btn-source-url" onclick="setSource('url')">🌐 URL</button>
            </div>

            <!-- URL Setup -->
            <div id="url-setup" class="hidden" style="margin-top: 20px;">
                <input type="text" id="url-input" placeholder="Paste Video URL (mp4/webm/blob)"
                    onchange="handleUrlInput(this.value)">
            </div>

            <!-- File Setup -->
            <div id="file-setup" class="hidden" style="margin-top: 20px;">
                <div class="file-drop-area" id="file-drop-area">
                    <input type="file" id="file-input" accept="video/mp4,video/webm" hidden
                        onchange="handleFileSelect(this)">
                    <span id="file-name-display">Select MP4/WebM File</span>
                </div>

                <div style="margin-top: 15px;">
                    <label>Aspect Ratio</label>
                    <select id="aspect-ratio" onchange="updateAspectRatio(this.value)">
                        <option value="original">Original</option>
                        <option value="16:9">16:9 (Widescreen)</option>
                        <option value="4:3">4:3 (Standard)</option>
                        <option value="21:9">21:9 (Ultrawide)</option>
                        <option value="custom">Custom</option>
                    </select>
                </div>
                <div id="custom-aspect-container" class="hidden" style="margin-top: 10px;">
                    <input type="text" id="custom-aspect-input" placeholder="e.g. 21:9, 16:9">
                </div>
                <div style="margin-top: 15px;">
                    <label>Scale Mode</label>
                    <select id="scale-mode" onchange="updateScaleMode(this.value)">
                        <option value="contain">Fit (Black Bars)</option>
                        <option value="cover">Fill (Crop)</option>
                        <option value="stretch">Stretch (Distort)</option>
                    </select>
                </div>
            </div>
            <div style="margin-top: 15px; display: flex; align-items: center; gap: 10px;">
                <input type="checkbox" id="force-stereo" style="width: 20px; height: 20px; margin: 0;">
                <label for="force-stereo" style="font-size: 14px; cursor: pointer;">Force Stereo (Best for
                    Tabs)</label>
            </div>
            <button class="btn" onclick="startBroadcasting()">Start Sharing</button>
        </div>
    </div>
    </div>
    <!-- View 3: Stage (Active Video) -->
    <div id="stage" class="hidden">
        <!-- Top Info Bar (Broadcaster) -->
        <div id="info-bar" class="hidden">
            <div class="info-pill">
                <span id="stage-room-code" style="font-weight: bold;">Code: ------</span>
                <span id="uptime" style="font-family: monospace; opacity: 0.8">00:00</span>
                <span id="viewer-count">👤 0</span>
                <button class="ctrl-btn small" onclick="copyRoomLink()" title="Copy Link">🔗</button>
            </div>
        </div>
        <!-- Waiting Message (Viewer) -->
        <div id="viewer-waiting" class="hidden"
            style="position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); text-align: center; z-index: 10;">
            <h2>Waiting for host to start sharing...</h2>
            <div class="loader"></div>
        </div><video id="main-video" autoplay playsinline></video>
        <!-- Stats Overlay (Viewer & Broadcaster) -->
        <div id="stats-overlay" class="hidden">
            <div>RESOLUTION: <span id="stat-res">-</span></div>
            <div>FPS: <span id="stat-fps">-</span></div>
            <div>BITRATE: <span id="stat-bitrate">-</span></div>
            <div>PACKETS LOSS: <span id="stat-loss">-</span></div>
        </div>

        <div id="controls-overlay">
            <!-- Broadcaster Controls -->
            <div id="broadcaster-controls" class="controls-row hidden">
                <!-- File Controls (Only visible when file source is active) -->
                <div id="file-controls" class="hidden"
                    style="flex-grow: 1; display: flex; align-items: center; gap: 10px; margin-right: 15px;">
                    <button class="ctrl-btn small" id="btn-play-pause" onclick="toggleFilePlayback()">⏯</button>
                    <span id="file-time-current" style="font-family: monospace; font-size: 0.8rem;">00:00</span>
                    <input type="range" id="file-timeline" min="0" max="100" value="0" style="flex-grow: 1;"
                        oninput="onSeek(this.value)">
                    <span id="file-time-total" style="font-family: monospace; font-size: 0.8rem;">00:00</span>
                </div>
                <div class="ctrl">
                    <span class="ctrl-label">Video</span>
                    <select id="video-bitrate-select" onchange="updateVideoBitrate(this.value)">
                        <option value="2">2 Mbps</option>
                        <option value="5">5 Mbps</option>
                        <option value="10">10 Mbps</option>
                        <option value="20" selected>20 Mbps</option>
                        <option value="40">40 Mbps</option>
                    </select>
                </div>
                <div class="ctrl">
                    <span class="ctrl-label">Audio</span>
                    <select id="audio-bitrate-select" onchange="updateAudioBitrateSelect(this.value)">
                        <option value="90">90 kbps</option>
                        <option value="128">128 kbps</option>
                        <option value="256">256 kbps</option>
                        <option value="320" selected>320 kbps</option>
                    </select>
                </div>
                <div class="ctrl-buttons">
                    <button class="ctrl-btn" onclick="changeScreen()">🔄 Switch</button>
                    <button class="ctrl-btn danger" onclick="stopSharing()">⏹ Stop</button>
                </div>
            </div>

            <!-- Viewer Controls -->
            <div id="viewer-controls" class="controls-row hidden">
                <div class="ctrl-buttons">
                    <button class="ctrl-btn" onclick="zoomOut()">➖</button>
                    <button class="ctrl-btn" onclick="resetZoom()">Fit</button>
                    <button class="ctrl-btn" onclick="zoomIn()">➕</button>
                </div>
                <button class="ctrl-btn" onclick="toggleFullscreen()">⛶ Fullscreen</button>
            </div>

            <!-- Common Controls -->
            <div class="ctrl">
                <button class="ctrl-btn" id="mute-btn" onclick="toggleMute()">🔊</button>
                <input type="range" min="0" max="1" step="0.1" value="1" id="volume-slider"
                    oninput="setVolume(this.value)">
            </div>
            <button class="ctrl-btn small" onclick="toggleStats()">📊</button>
        </div>
    </div>
    </div>
    <script src="script.js"></script>
</body>

</html>
